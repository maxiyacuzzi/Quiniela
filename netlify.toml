[build.environment]
  # Supabase deja de soportar Node 20; Node 22 es lo que piden sus paquetes.
  NODE_VERSION = "22"
  # Falsos positivos del escaneo de secretos: las NEXT_PUBLIC_* están
  # pensadas para ser públicas (la anon key de Supabase es segura de exponer,
  # el acceso real lo controla RLS), y SCRAPE_SECRET/GEMINI_API_KEY solo
  # aparecen en chunks del servidor (rutas API y server actions), nunca en el
  # bundle del navegador.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SCRAPE_SECRET,GEMINI_API_KEY"

[functions]
  directory = "netlify/functions"

# Mismos horarios que vercel.json (10 min después de cada sorteo, hora Argentina).
[functions."scrape-previa"]
  schedule = "25 13 * * *"

[functions."scrape-primera"]
  schedule = "10 15 * * *"

[functions."scrape-matutina"]
  schedule = "10 18 * * *"

[functions."scrape-vespertina"]
  schedule = "10 21 * * *"

[functions."scrape-nocturna"]
  schedule = "10 0 * * *"
