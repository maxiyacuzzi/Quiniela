[build.environment]
  # Falsos positivos del escaneo de secretos: NEXT_PUBLIC_SUPABASE_URL está
  # pensada para ser pública, y SCRAPE_SECRET/GEMINI_API_KEY solo aparecen en
  # chunks del servidor (rutas API y server actions), nunca en el bundle del
  # navegador.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,SCRAPE_SECRET,GEMINI_API_KEY"

[functions]
  directory = "netlify/functions"

# Mismos horarios que vercel.json (10 min después de cada sorteo, hora Argentina).
[functions."scrape-previa"]
  schedule = "25 13 * * *"

[functions."scrape-primera"]
  schedule = "10 15 * * *"

[functions."scrape-matutina"]
  schedule = "10 18 * * *"

[functions."scrape-vespertina"]
  schedule = "10 21 * * *"

[functions."scrape-nocturna"]
  schedule = "10 0 * * *"
